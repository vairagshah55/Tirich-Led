<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Tirich LED — Premium precision LED lighting solutions for residential, commercial, and hospitality spaces." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Tirich LED — Precision Lighting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Splash screen ───────────────────────────────────────────── */
      #tirich-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #tirich-splash.splash-hide {
        opacity: 0;
        visibility: hidden;
      }

      /* Brand wordmark */
      .splash-wordmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
      }
      .splash-tirich {
        font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
        font-size: clamp(3.2rem, 9vw, 5.8rem);
        font-weight: 700;
        letter-spacing: 0.32em;
        color: #151515;
        line-height: 1;
        margin: 0;
        opacity: 0;
        transform: translateY(16px);
        animation: splashUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
      }
      .splash-rule {
        width: 0;
        height: 1px;
        background: #FF9D1C;
        animation: splashRule 0.45s ease 0.35s forwards;
      }
      .splash-led {
        font-family: 'Inter', Arial, sans-serif;
        font-size: clamp(0.6rem, 1.4vw, 0.72rem);
        font-weight: 500;
        letter-spacing: 0.62em;
        text-transform: uppercase;
        color: #FF9D1C;
        margin: 0;
        opacity: 0;
        transform: translateY(10px);
        animation: splashUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.48s forwards;
      }

      /* Sweep bar */
      .splash-bar-wrap {
        width: 48px;
        height: 1px;
        background: rgba(255, 157, 28, 0.12);
        overflow: hidden;
        margin-top: 3.2rem;
        opacity: 0;
        animation: splashFade 0.4s ease 0.7s forwards;
      }
      .splash-bar {
        height: 100%;
        width: 45%;
        background: #FF9D1C;
        animation: splashSweep 1.05s ease-in-out 1.1s infinite;
      }

      @keyframes splashUp {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splashRule {
        to { width: 40px; }
      }
      @keyframes splashFade {
        to { opacity: 1; }
      }
      @keyframes splashSweep {
        0%   { transform: translateX(-160%); }
        100% { transform: translateX(380%); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="tirich-splash">
      <div class="splash-wordmark">
        <p class="splash-tirich">TIRICH</p>
        <span class="splash-rule"></span>
        <p class="splash-led">LED</p>
      </div>
      <div class="splash-bar-wrap"><div class="splash-bar"></div></div>
    </div>
    <div id="root"></div>
  </body>
</html>
